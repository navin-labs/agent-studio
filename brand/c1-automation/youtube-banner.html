<!doctype html>
<!-- YouTube banner, C1 The Automation Guy. 2560x1440; everything that matters sits in the 1546x423 safe area (all devices).
     Palette "Night Signal" (Forge's pick, night theme tokens); add ?paper for the "Paper Day" option. Render: README.md. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter Tight'; font-weight: 900; src: url(../../engine/public/fonts/inter-tight-latin-900-normal.woff2); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url(../../engine/public/fonts/jetbrains-mono-latin-700-normal.woff2); }
  :root { --bg: #0B0B10; --dot: #26262F; --head: #F4F1EA; --accent: #C6F432; --handle: #A8A59E; --flow: #C6F432; --chip: transparent; }
  :root.paper { --bg: #F4F1EA; --dot: #E3DED3; --head: #111111; --accent: #2B4BFF; --handle: #5C5A55; --flow: #2B4BFF; --chip: #111111; }
  html { margin: 0; } body { margin: 0; width: 2560px; height: 1440px; position: relative; background: var(--bg); overflow: hidden; }
  .grid { position: absolute; inset: 0; background-image: radial-gradient(var(--dot) 2.5px, transparent 2.5px); background-size: 48px 48px; }
  /* the flow line runs across the whole desktop strip (2560 x 423) */
  .flow { position: absolute; left: 0; right: 0; top: 719px; height: 3px; background: var(--flow); }
  .node { position: absolute; top: 708px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); border: 3px solid var(--flow); }
  .node.done { background: var(--flow); }
  .safe { position: absolute; left: 507px; top: 509px; width: 1546px; height: 423px; display: flex; align-items: center; justify-content: center; }
  .plate { background: var(--bg); display: flex; align-items: center; gap: 72px; padding: 0 56px 0 24px; }
  .mark { width: 270px; height: 270px; background: var(--chip); border-radius: 40px; }
  h1 { margin: 0; font: 900 92px/1.04 'Inter Tight', sans-serif; letter-spacing: -2px; color: var(--head); white-space: nowrap; }
  h1 span { color: var(--accent); }
  p { margin: 28px 0 0; font: 700 40px/1 'JetBrains Mono', monospace; color: var(--handle); }
  /* ?fb : Facebook cover, 1640x856 upload; desktop shows the middle 1640x624, mobile the middle 1522x856; content sits in both */
  :root.fb body { width: 1640px; height: 856px; }
  :root.fb .flow, :root.fb .node { display: none; } /* the text fills the cover width; no room for the flow line */
  :root.fb .safe { left: 59px; top: 116px; width: 1522px; height: 624px; }
  /* Forge review 2026-10-02: no logo on the cover (the profile picture sits at its lower left), centred text, a line for Send Message */
  :root.fb .mark { display: none; }
  :root.fb .plate { transform: scale(0.88); text-align: center; padding: 0; }
  .fbonly { display: none; margin-top: 18px; } :root.fb .fbonly { display: block; }
</style>
<script>for (const c of ['paper', 'fb']) if (new URLSearchParams(location.search).has(c)) document.documentElement.classList.add(c);</script>
<div class="grid"></div>
<div class="flow"></div>
<div class="node done" style="left:140px"></div><div class="node done" style="left:300px"></div>
<div class="node" style="left:calc(100% - 320px)"></div><div class="node" style="left:calc(100% - 160px)"></div>
<div class="safe">
  <div class="plate">
    <img class="mark" src="../../engine/public/brand/mark.png">
    <div>
      <h1>One business automation,<br><span>every day.</span></h1>
      <p>@theautomationguynavin</p>
      <p class="fbonly">Message us AUDIT for a free review.</p>
    </div>
  </div>
</div>
