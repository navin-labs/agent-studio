name: ci
on:
  push:
    branches: [main]
  pull_request:

# No secrets, no publishing, no model calls: `npm run check` uses temporary directories, fixtures and a fake `claude` binary only.
# macOS on Apple silicon is deliberate: engine/scripts/film.mjs runs Remotion's bundled ffmpeg from compositor-darwin-arm64.
permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest # macOS 26 arm64 per actions/runner-images (checked 2026-10-26)
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0 # exact: the version every local result in docs/proof was produced on (it is in actions/node-versions for darwin arm64)
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - name: Runner is what the tests assume
        run: |
          test "$(uname -m)" = arm64 || { echo "needs an arm64 macOS runner (film.mjs uses compositor-darwin-arm64)"; exit 1; }
          node --version
          openssl version   # the HTTPS test makes a throwaway certificate with it
      - run: npm ci
      - run: npm run check
        env:
          CI: 'true'
          TZ: UTC
